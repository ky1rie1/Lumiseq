name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch and verify pinned model
        run: npm run model:download
      - run: npm run typecheck
      - run: npm test
      - name: Check source and documentation
        run: npm run repo:check
      - run: npm run build
      - name: Check runtime dependencies
        run: npm audit --omit=dev --audit-level=high
