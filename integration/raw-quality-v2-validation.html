 const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl2',{preserveDrawingBuffer:true});
 if(!gl)throw new Error('WebGL2 unavailable');

  canvas.width=w;canvas.height=h;graph.resize(w,h);

   bind(base,'u_image',read);gl.uniform1i(gl.getUniformLocation(base,'u_input_linear'),1);gl.uniform1i(gl.getUniformLocation(base,'u_white_balance_applied'),1);
   gl.uniform1i(gl.getUniformLocation(base,'u_rendering_version'),s.renderingVersion??1);gl.uniform1i(gl.getUniformLocation(base,'u_wb_mode'),0);
   for(const name of ['exposure','contrast','highlights','shadows','whites','blacks'])gl.uniform1f(gl.getUniformLocation(base,'u_'+name),s[name]);
  });

  else graph.runPass(legacy,read=>{
   bind(legacy,'u_image',read);gl.uniform2f(gl.getUniformLocation(legacy,'u_texel_size'),1/w,1/h);
   for(const [name,value] of Object.entries({u_spatial_scale:scale,u_texture:s.texture,u_clarity:s.clarity,u_sharpen_amount:s.detail.sharpenAmount,u_sharpen_radius:s.detail.sharpenRadius,u_sharpen_threshold:s.detail.sharpenThreshold}))gl.uniform1f(gl.getUniformLocation(legacy,name),value);
  });

   bind(color,'u_image',read);gl.uniform1i(gl.getUniformLocation(color,'u_curve_enabled'),0);gl.uniform1i(gl.getUniformLocation(color,'u_hsl_enabled'),1);
   gl.uniform1f(gl.getUniformLocation(color,'u_vibrance'),s.vibrance);gl.uniform1f(gl.getUniformLocation(color,'u_saturation'),s.saturation);

    if(!Number.isFinite(v))throw new Error(name+' nonfinite output');

   }

 };
 const n=61,round=new Float32Array(n*n*3);
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){
  const v=.002+.8*Math.exp(-((x-30.25)**2+(y-29.5)**2)/2);round.set([v,v,v],(y*n+x)*3);
 }
 const s=createDefaultDevelopSettings(true);s.clarity=40;s.detail.sharpenAmount=80;s.detail.sharpenRadius=1.8;
 const points=run('round point lights',n,n,round,s);report.cases.at(-1).passed&&=report.cases.at(-1).minimumAdded>-.001;
 const rotate=a=>{const b=new Float32Array(a.length);for(let y=0;y<n;y++)for(let x=0;x<n;x++)for(let c=0;c<3;c++)b[(x*n+n-1-y)*3+c]=a[(y*n+x)*3+c];return b;};
 const rotated=run('rotated subpixel point lights',n,n,rotate(round),s),reference=rotate(points);
 const rotationError=Math.max(...rotated.map((v,i)=>Math.abs(v-reference[i])));report.cases.push({name:'GPU rotation symmetry',maxError:rotationError,passed:rotationError<2e-5});
 s.texture=55;run('reduced original-pixel scales',n,n,round,s,.27);
 const signed=Float32Array.from(Array.from({length:n*n},()=>[-.2,.4,3.5]).flat());run('signed HDR flat field',n,n,signed,s);
 const edge=Float32Array.from(Array.from({length:n*n},(_,i)=>i%n+.7*Math.floor(i/n)>50?[2,-.1,.4]:[.002,.003,.006]).flat());run('inclined signed HDR edge',n,n,edge,s);
 const tone=createDefaultDevelopSettings(true);Object.assign(tone,{exposure:-.3,contrast:25,highlights:-90,shadows:30,whites:-20,blacks:-10});
 run('joint HDR tone staircase',7,1,Float32Array.from([.18,.5,1,2,4,8,16].flatMap(v=>[v,v,v])),tone);
 const legacySettings=createDefaultDevelopSettings(false);delete legacySettings.renderingVersion;legacySettings.detail.sharpenAmount=100;
 const legacyOut=run('legacy missing-version edge',5,1,Float32Array.from([.25,.25,.7,.7,.7].flatMap(v=>[v,v,v])),legacySettings);
 report.cases.push({name:'legacy independent golden',actual:legacyOut[6],passed:Math.abs(legacyOut[6]-.80125)<2e-6});
 const small=createDefaultDevelopSettings(true);small.contrast=60;
 const tiny=run('sub-display contrast precision',4,1,Float32Array.from([1e-9,1e-8,1e-7,1e-6].flatMap(v=>[v,v,v])),small);
 const blackDerivative=2**.6/Math.expm1(Math.LN2*2**.6);
 report.cases.push({name:'contrast derivative at black',actual:tiny[0]/1e-9,passed:Math.abs(tiny[0]/1e-9-blackDerivative)<1e-4});
 for(const parameter of ['contrast','highlights','shadows'])for(const value of [-100,-50,50,100]){
  const control=createDefaultDevelopSettings(true);control[parameter]=value;
  const input=[1e-9,.0001,.01,.02,.05,.18,.3,.5,1,2,4];
  const result=run(parameter+' '+value,input.length,1,Float32Array.from(input.flatMap(y=>[y,y,y])),control);
  let passed=result.every(Number.isFinite)&&input.every((_,i)=>i===0||result[i*3]>result[(i-1)*3]);
  if(parameter==='contrast')passed&&=Math.abs(result[15]-.18)<1e-6&&(result[9]-.02)*value<0&&(result[21]-.5)*value>0;
  if(parameter==='highlights')passed&&=Math.abs(result[9]-.02)<1e-6&&Math.abs(result[15]-.18)<1e-6;
  if(parameter==='shadows')passed&&=(result[6]-.01)*value>0&&Math.abs(result[24]-1)<.025;
  report.cases.push({name:parameter+' '+value+' independent tonal response',passed});
 }
 const sharpening=createDefaultDevelopSettings(true);sharpening.detail.sharpenAmount=100;
 const strong=run('ordinary edge strength',41,1,Float32Array.from(Array.from({length:41},(_,i)=>i<20?[.1,.1,.1]:[.4,.4,.4]).flat()),sharpening);
 report.cases.push({name:'edge control strength',actual:strong[60]-.4,passed:strong[60]-.4>.045});
 const smooth=createDefaultDevelopSettings(true);smooth.texture=-100;
 const softened=run('negative texture smoothing',41,41,Float32Array.from(Array.from({length:41*41},(_,i)=>i%2?[.02,.02,.02]:[.04,.04,.04]).flat()),smooth);
 report.cases.push({name:'texture control strength',actual:Math.abs(softened[(20*41+20)*3]-softened[(20*41+21)*3]),passed:Math.abs(softened[(20*41+20)*3]-softened[(20*41+21)*3])<.012});
 tone.hsl.red={hue:15,saturation:-20,luminance:-50};tone.hsl.blue={hue:-10,saturation:25,luminance:30};tone.vibrance=30;tone.saturation=10;
 run('preserved HSL and HDR color',3,1,Float32Array.from([2,0,0,.2,.3,1.5,.25,.2,.15]),tone,1,true);
 const fixtureResponse=await fetch('/docs/superpowers/native-v2-fixture.json');
 if(!fixtureResponse.ok)throw new Error('Generate native v2 fixtures before the three-backend probe');
 const nativeFixtures=await fixtureResponse.json();
 for(const fixture of nativeFixtures.cases) {
  const s=createDefaultDevelopSettings(true),recipe=fixture.recipe;
  for(const name of ['exposure','contrast','highlights','shadows','whites','blacks','texture','clarity'])s[name]=recipe[name];
  s.detail.sharpenAmount=recipe.sharpen_amount;s.detail.sharpenRadius=recipe.sharpen_radius;s.detail.sharpenThreshold=recipe.sharpen_threshold;
  const actual=run('native-source '+fixture.name,fixture.width,fixture.height,Float32Array.from(fixture.source.flat()),s),reference=fixture.output.flat();

 }

} catch(error) {report.errors.push(String(error));}
report.complete=true;document.querySelector('#report').textContent=JSON.stringify(report,null,2);
</script></html>
